name: Test Build
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: codeberg-medium
    container:
      image: codeberg.org/nathawat/howdy-next/ci-1:latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: |
          meson setup build --wrap-mode=nodownload
          ninja -C build
          meson test -C build --print-errorlogs
