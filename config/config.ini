[core]
# Show scan attempt messages.
detection_notice = false

# Stay quiet after successful auth.
no_confirmation = false

# Disable in SSH sessions.
abort_if_ssh = true

# Disable when lid is closed.
abort_if_lid_closed = true

# Disable PAM auth only.
disabled = false

# Stop password prompt workaround: off, input, native.
# Native can lead to instability!.
workaround = off

[video]
# Scan timeout in seconds.
timeout = 4

# Camera path. Use /dev/v4l/by-path/* when possible.
device_path = none

# Warn if camera is missing.
warn_no_device = true

# Resize feed for speed. 320 is good for laptop IR.
max_height = 320

# Force camera profile; -1 picks default/largest.
frame_width = -1
frame_height = -1

# CLAHE improves low-contrast IR, but can make image noise appear darker.
clahe_enabled = true
clahe_clip_limit = 1.25
clahe_tile_grid_size = 8

# Skip frames whose darkest histogram bin exceeds this %.
dark_threshold = 75

# OPENCV: force MJPEG decode.
force_mjpeg = false

# OPENCV: manual exposure; -1 keeps auto.
exposure = -1

# OPENCV: camera FPS; -1 keeps default.
device_fps = -1

# Rotation: 0 landscape, 1 both, 2 portrait.
rotate = 0

[face]
# ONNX model paths. Use `howdy download-models` for defaults.
yunet_model = default
sface_model = default

# YuNet detector. Lower score helps weak IR frames.
yunet_score_threshold = 0.8845
yunet_nms_threshold = 0.3
yunet_top_k = 1000

# SFace matcher. Cosine: higher is better.
sface_metric = cosine
sface_threshold = 0.6942

[snapshots]
# Save failed login snapshots.
save_failed = false

# Save successful login snapshots.
save_successful = false

[debug]
# Print timing/debug report.
end_report = false

# Print GTK auth output.
gtk_stdout = false
